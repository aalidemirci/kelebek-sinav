<?xml version="1.0"?>
<!--
  Kelebek Sınav — PAKET İÇİ fontconfig yapılandırması (Windows).

  NEDEN BU DOSYA VAR (ilk CI koşularının bulgusu):
  PyInstaller, MSYS2'nin `etc/fonts/` ağacını pakete gömüyor ve Windows'ta
  libfontconfig yapılandırmasını DLL'in yanındaki bu ağaçtan çözüyor —
  `FONTCONFIG_FILE` ortam değişkenini DİNLEMİYOR (mingw DLL'i, Python'un
  yazdığı ortam değişkenini görmüyor). FC_DEBUG çıktısı bunu kanıtladı:

      Loading config file from ...\_internal\etc\fonts\fonts.conf

  MSYS2'nin gömülen varsayılanı Windows font dizinini tarıyordu; sonuç olarak
  Türkçe evrak gömülü DejaVu yerine sistem fontuyla (Verdana) diziliyordu.
  Çözüm ortam değişkeniyle uğraşmak değil, fontconfig'in ZATEN baktığı yere
  doğru dosyayı koymak: `build.ps1` bu dosyayı derleme sonrası
  `_internal/etc/fonts/fonts.conf` üzerine yazar.

  DOCTYPE satırı bilinçli olarak YOK (bkz. fonts.conf.tmpl'deki gerekçe).

  Yollar `prefix="relative"` ile bu dosyanın DİZİNİNE göre çözülür:
  dosya `_internal/etc/fonts/` içinde durduğundan `../../fonts` →
  `_internal/fonts` (gömülü DejaVu kesimlerinin bulunduğu dizin).
-->
<fontconfig>

  <!-- Taranacak TEK font dizini: paketle gelen DejaVu kesimleri.
       WINDOWSFONTDIR bilinçli olarak EKLENMEZ (tasarım §5.1: okul
       bilgisayarındaki sistem fontuna güvenilmez). -->
  <dir prefix="relative">../../fonts</dir>

  <!-- Önbellek kullanıcı dizinine yazılır; kurulum dizini salt-okunur olabilir.
       Yazılamazsa fontconfig önbelleksiz çalışır (yalnız daha yavaş açılır). -->
  <cachedir prefix="xdg">kelebek-sinav/fontconfig</cachedir>

  <!-- Genel aileler gömülü DejaVu kesimlerine bağlanır. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>

  <!-- Eşleşmeyen her istek de DejaVu Sans'a düşer (boş sayfa yerine metin). -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>DejaVu Sans</string></edit>
  </match>

</fontconfig>
