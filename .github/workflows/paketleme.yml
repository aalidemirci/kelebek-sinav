# =============================================================================
# .github/workflows/paketleme.yml — Windows + Linux paket üretimi (tasarım §12 F9)
# =============================================================================
# KS'nin kendi ilk koşusu 29.08.2026'da uçtan uca YEŞİL (run 33257833345 —
# docs/teknik-borc.md TB5): Linux .deb + debian:11/12 kurulum provası + Windows
# setup.exe/portable.zip; iki platformda Türkçe PDF duman testi gömülü DejaVu
# ile geçti. Zincirin üç kurucu düzeltmesi DD şablonundan devralındı (PS1
# BOM'suzluğu, MSYS2 python'unun setup-python'ı gölgelemesi, paket içi
# fontconfig).
#
# Akış:
#   arayuz          → frontend/dist artefaktı (bir kez derlenir, iki paket işi indirir)
#   linux           → python:3.12-bullseye kabında onedir + .deb + .tar.gz
#   linux-kurulum   → temiz debian:11 VE debian:12 kaplarında kurulum provası
#   windows         → msys2 + ntldd + PyInstaller + Türkçe PDF duman testi + Inno
#   yayin           → v* etiketinde SHA256SUMS.txt + GitHub Release + paketlerin
#                     indir.okulapp.org'a (Cloudflare R2) yüklenmesi
# =============================================================================
name: Paketleme

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/paketleme.yml"
      - "VERSION"
      # K7 sigortası (CLAUDE.md §2): hiddenimports'u unutturan değişiklik sınıfı
      # tam da backend/desktop tarafıdır — süzgeç onları dışarıda bırakırsa
      # `--pdf-duman` kapısı sürüm etiketine dek hiç ateşlenmez (F9 bulgusu).
      - "backend/**"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  arayuz:
    name: Arayüz derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci
      - name: Derle
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  linux:
    name: Linux paketi (.deb + .tar.gz)
    needs: arayuz
    runs-on: ubuntu-latest
    # Tasarım §2.2 K6: glibc 2.31 = Pardus 21 tabanı. Daha yeni bir tabanda
    # derlenen paket Pardus 21'de açılmaz.
    container:
      image: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v7
      - name: Sürüm etiketi ↔ VERSION kapısı
        # Kurucu adı VERSION'dan, Release sürümü etiketten türer; ayrışırlarsa
        # updates.py güncelleme afişi hiç kapanmaz (F9 bulgusu).
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Paketleri üret
        run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-paketleri
          path: |
            dist/cikti/*.deb
            dist/cikti/*.tar.gz
            dist/cikti/pdf-duman.pdf
          retention-days: 7

  # ---------------------------------------------------------------------------
  linux-kurulum:
    name: Kurulum provası (debian:${{ matrix.debian }})
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 = bullseye (Pardus 21 tabanı), 12 = bookworm (Pardus 23 tabanı)
        debian: ["11", "12"]
    container:
      image: debian:${{ matrix.debian }}
    steps:
      # Temiz debian imajında git yok; actions/checkout git olmadan da çalışır
      # ama tarball yoluna düşer. Açıkça kurmak koşuyu öngörülebilir kılar.
      #
      # Sarmal BURADA İNLİNE olmak ZORUNDA: bu adım checkout'tan ÖNCE koşar,
      # `packaging/linux/apt_dene.sh` henüz diskte yoktur. Gerekçe ve davranış
      # o dosyanın başlığında — 04.09.2026'da v2026.9.0-beta.5 etiket koşusu tam
      # bu adımda `libperl5.32` için 404 alıp düştü (aynı commit yeniden
      # denemede geçti); listeler her denemede silinir, çünkü asıl sorun kap
      # imajındaki BAYAT apt indeksidir.
      - name: git
        run: |
          deneme=1
          while :; do
            if apt-get update -qq && apt-get install -y -qq \
                --no-install-recommends -o Acquire::Retries=3 git ca-certificates; then
              break
            fi
            if [ "$deneme" -ge 3 ]; then
              echo "HATA: git/ca-certificates 3 denemede de kurulamadı." >&2
              exit 1
            fi
            echo "::warning::apt $deneme. denemede başarısız (ayna tutarsızlığı olabilir); listeler tazelenip yeniden denenecek."
            rm -rf /var/lib/apt/lists/*
            deneme=$((deneme + 1))
            sleep $((deneme * 10))
          done
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-paketleri
          path: paketler
      - name: Temiz kurulum + --autotest + PDF duman testi
        run: bash packaging/linux/kap-ici-test.sh
        env:
          # kap-ici-test.sh paketleri /paketler altında arar.
          PAKET_DIZINI: paketler
      - name: Yerleşim (paket dizini)
        if: always()
        run: ls -la paketler

  # ---------------------------------------------------------------------------
  windows:
    name: Windows paketi (setup.exe + portable.zip)
    needs: arayuz
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sürüm etiketi ↔ VERSION kapısı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WeasyPrint'in çalışma anında açtığı pango/harfbuzz/fontconfig DLL'leri
      # MSYS2'den gelir; ntldd bağımlılık kapanışını hesaplar (tasarım §5.1).
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-binutils

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: WebView2 Evergreen kurucusu
        # Kurulum paketine gömülür; WebView2 yoksa sessizce kurar.
        # LinkId doğrulanmadı (NOTLAR.md/W5) — indirilemezse adım atlanır,
        # paket yine üretilir ve program ilk açılışta yönlendirme verir.
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "packaging\windows\MicrosoftEdgeWebView2Setup.exe"

      - name: Paketleri üret (DLL kapanışı + PyInstaller + duman testi + Inno)
        shell: pwsh
        env:
          # setup-msys2 kurulum yerini çıktı olarak verir; boş dönerse
          # bilinen iki konum denenir (NOTLAR.md/W1).
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $adaylar = @(
            "$env:MSYS2_LOCATION\mingw64\bin",
            "$env:RUNNER_TEMP\msys64\mingw64\bin",
            "C:\msys64\mingw64\bin"
          )
          $mingw = $adaylar | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $mingw) { throw "MSYS2 mingw64\bin bulunamadı: $($adaylar -join ', ')" }
          # mingw SONA eklenir: mingw64\bin icinde python.exe de var ve basa
          # eklenirse setup-python'in Python'unu golgeler (pip bulunamaz).
          $env:PATH = "$env:PATH;$mingw"
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -MingwBin $mingw

      - uses: actions/upload-artifact@v7
        with:
          name: windows-paketleri
          path: |
            dist/cikti/*.exe
            dist/cikti/*.zip
            dist/cikti/pdf-duman.pdf
          retention-days: 7

  # ---------------------------------------------------------------------------
  yayin:
    name: Yayın (GitHub Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-kurulum, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-paketleri
          path: yayin
      - uses: actions/download-artifact@v8
        with:
          name: windows-paketleri
          path: yayin
      - name: SHA256SUMS.txt
        working-directory: yayin
        run: |
          rm -f pdf-duman.pdf
          for paket in *~*.deb; do
            [ -e "${paket}" ] || continue
            # Tilde TIRNAKLI olmak ZORUNDA: bash `${degisken//desen/…}` içindeki
            # deseni sözcük genişletmesinden geçirir, çıplak `~` `$HOME`a dönüşür
            # ve hiçbir şey eşleşmez. İlk etiketli koşu (v2026.8.0-beta.1) tam
            # buradan `mv: … are the same file` ile kırıldı — `yayin` işi yalnız
            # `v*` etiketinde koştuğu için PR/dispatch kapıları bunu göremiyordu.
            mv -- "${paket}" "${paket//'~'/.}"
          done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ON_SURUM=""
          case "${GITHUB_REF_NAME}" in
            *-beta.*|*-rc.*|*-dev*) ON_SURUM="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" yayin/* \
            --repo "${GITHUB_REPOSITORY}" \
            ${ON_SURUM} \
            --title "Kelebek Sınav ${GITHUB_REF_NAME}" \
            --notes "Beta sürümüdür. Gerçek okul verisiyle kullanmadan önce şifreli yedek alın. Kurulum adımları: docs/kurulum.md — imzasız paketleri SHA256SUMS.txt ile doğrulayın."

      # --- indir.okulapp.org (Cloudflare R2) --------------------------------
      # Neden GitHub Release'den SONRA: MEB ağında GitHub sık sık engellidir ve
      # okullar paketi siteden indirir, ama asıl yayın kaydı Release'tir. R2
      # yüklemesi kırılırsa sürüm elde kalsın diye sıra bu; adım kırmızı olur ve
      # eksik dosya görünür kalır (sessiz düşme yok).
      #
      # Kimlik yoksa iş DURMAZ, uyarıyla atlanır: depoyu çatallayan ya da
      # secret'ları olmayan bir ortamda sürüm çıkarmak yine mümkün olmalı.
      # Gereken secret'lar: CLOUDFLARE_API_TOKEN (R2 Object Read & Write) +
      # CLOUDFLARE_ACCOUNT_ID.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: İndirme alanına yükle (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KOVA: okulapp-indirme
          R2_ONEK: kelebek-sinav
        working-directory: yayin
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN/ACCOUNT_ID tanımsız — R2 yüklemesi atlandı; paketler yalnız GitHub Release'te."
            exit 0
          fi
          SURUM="${GITHUB_REF_NAME#v}"
          for dosya in *; do
            # SHA256SUMS SÜRÜMLÜ adla yüklenir: kovada eski sürümlerin paketleri
            # durmaya devam eder, sabit ad her yayında onların özetini silerdi.
            case "${dosya}" in
              SHA256SUMS.txt) hedef="SHA256SUMS-${SURUM}.txt"; tip="text/plain; charset=utf-8" ;;
              *.exe)          hedef="${dosya}"; tip="application/vnd.microsoft.portable-executable" ;;
              *.zip)          hedef="${dosya}"; tip="application/zip" ;;
              *.deb)          hedef="${dosya}"; tip="application/vnd.debian.binary-package" ;;
              *.tar.gz)       hedef="${dosya}"; tip="application/gzip" ;;
              *)              echo "::warning::Türü bilinmeyen dosya R2'ye yüklenmedi: ${dosya}"; continue ;;
            esac
            echo "→ ${R2_ONEK}/${hedef}"
            npx --yes wrangler@4 r2 object put "${R2_KOVA}/${R2_ONEK}/${hedef}" \
              --file="${dosya}" --content-type="${tip}" --remote
          done
          echo "::notice::Paketler indir.okulapp.org/${R2_ONEK}/ altına yüklendi. Sıradaki elle iş: okulapp.org deposunda src/data/ks-release.json (sürüm, tarih ve boyutlar) güncellenmeli."
