# =============================================================================
# .github/workflows/kapilar.yml — kalite kapıları (test + lint + tip + KVKK)
# =============================================================================
# 18.09.2026 değerlendirmesinin bulgusu: depoda yalnız paketleme iş akışı vardı;
# test/lint kapısı tümüyle yerel `scripts/gates.sh` koşusuna bağlıydı ve
# `frontend/src` değişikliği HİÇBİR koşuyu tetiklemiyordu. Bu iş akışı yerel
# kapı betiğini OLDUĞU GİBİ koşar — ikinci bir komut listesi tutulmaz (iki
# doğruluk kaynağı zamanla ayrışır). Betik Docker ister; GitHub'ın Ubuntu
# koşucusunda `docker compose` hazırdır.
#
# Kapsam: KVKK depo denetimi → backend pytest (kapsam eşiği) → ruff → mypy →
# masaüstü/paketleme testleri → frontend tsc/eslint/prettier/vitest.
# Paket ÜRETİMİ ayrı iş akışıdır (paketleme.yml) ve yalnız ilgili yollar
# değişince koşar; bu iş akışı her PR'da ve main'e her push'ta koşar.
# =============================================================================
name: Kapılar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Aynı dalda art arda gelen push'larda eski koşu iptal edilir.
concurrency:
  group: kapilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kapilar:
    name: scripts/gates.sh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Backend imajını derle
        run: docker compose build backend

      - name: Ön yüz bağımlılıkları
        # Kapı betiği node_modules'u hazır bekler (yerelde bir kez kurulur).
        run: docker compose run --rm -T frontend npm ci

      - name: Kapı zinciri
        run: bash scripts/gates.sh
